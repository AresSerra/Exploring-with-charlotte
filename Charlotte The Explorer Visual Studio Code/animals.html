<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animals</title>
    <style>
      :root {
        --bg: #f3e3b7;
        --ink: #111111;
        --shadow: rgba(92, 58, 18, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        background: radial-gradient(
          circle at top,
          #f8ebc8 0%,
          var(--bg) 70%,
          #ecd79f 100%
        );
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }

      .page {
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px 36px 24px;
      }

      .hero {
        display: grid;
        gap: 12px;
      }

      .title-block {
        position: relative;
        margin-bottom: 4px;
      }

      h1 {
        margin: 0;
        font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
        font-size: clamp(5rem, 8.8vw, 8.8rem);
        line-height: 0.86;
        letter-spacing: 0.01em;
      }

      .subtitle {
        position: relative;
        left: 160px;
        top: -2px;
        display: inline-block;
        font-size: clamp(1.45rem, 2vw, 1.95rem);
        font-style: italic;
        font-weight: 700;
        transform: skewX(-8deg);
      }

      .intro {
        margin: 0;
        font-size: 1.1rem;
        line-height: 1.12;
      }

      .content {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 26px 42px;
        align-items: start;
      }

      .panel {
        min-width: 0;
      }

      .heading {
        margin: 12px 0 6px;
        font-size: 1.35rem;
        font-weight: 800;
      }

      .facts,
      .curiosities {
        margin: 0;
        font-size: 1.07rem;
        line-height: 1.14;
      }

      .curiosities {
        padding-left: 24px;
      }

      .curiosities li {
        margin-bottom: 3px;
      }

      .media-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 28px 42px;
        align-items: end;
        margin-top: 6px;
      }

      .media-grid.reverse .animal-stage {
        order: 2;
      }

      .media-grid.reverse .video-stage {
        order: 1;
      }

      .animal-stage {
        position: relative;
        min-height: 405px;
      }

      .animal-stage::before {
        content: "";
        position: absolute;
        left: var(--circle-left, 52px);
        right: var(--circle-right, auto);
        top: var(--circle-top, auto);
        bottom: var(--circle-bottom, 24px);
        width: var(--circle-size, 300px);
        height: var(--circle-size, 300px);
        border-radius: 50%;
        background: var(--circle, #e14210);
      }

      .animal-image {
        position: absolute;
        left: var(--animal-left, -16px);
        right: var(--animal-right, auto);
        bottom: var(--animal-bottom, 0);
        width: var(--animal-width, min(98%, 500px));
        max-width: none;
        height: auto;
        filter: drop-shadow(0 10px 18px rgba(43, 24, 7, 0.22));
      }

      .animal-image.fit-right {
        left: auto;
        right: var(--animal-right, 0);
      }

      .video-title {
        margin: 0 0 10px;
        font-size: 1.42rem;
        font-weight: 800;
      }

      .video-stage {
        position: relative;
        width: 100%;
      }

      .video-sketch {
        position: absolute;
        pointer-events: none;
        opacity: 0.72;
      }

      .video-sketch.grass {
        right: 12px;
        top: -74px;
        width: 185px;
        height: 88px;
        background:
          radial-gradient(
            circle at 18% 88%,
            rgba(95, 95, 95, 0.38) 0 1px,
            transparent 2px
          ),
          radial-gradient(
            circle at 30% 92%,
            rgba(95, 95, 95, 0.35) 0 1px,
            transparent 2px
          ),
          radial-gradient(
            circle at 42% 90%,
            rgba(95, 95, 95, 0.32) 0 1px,
            transparent 2px
          ),
          radial-gradient(
            circle at 56% 88%,
            rgba(95, 95, 95, 0.35) 0 1px,
            transparent 2px
          ),
          radial-gradient(
            circle at 70% 93%,
            rgba(95, 95, 95, 0.33) 0 1px,
            transparent 2px
          ),
          radial-gradient(
            circle at 84% 89%,
            rgba(95, 95, 95, 0.3) 0 1px,
            transparent 2px
          );
      }

      .video-sketch.grass::before,
      .video-sketch.grass::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            105deg,
            transparent 0 38%,
            rgba(120, 120, 120, 0.5) 38% 39%,
            transparent 39% 100%
          ),
          linear-gradient(
            82deg,
            transparent 0 18%,
            rgba(120, 120, 120, 0.52) 18% 19%,
            transparent 19% 100%
          ),
          linear-gradient(
            94deg,
            transparent 0 58%,
            rgba(120, 120, 120, 0.45) 58% 59%,
            transparent 59% 100%
          ),
          linear-gradient(
            88deg,
            transparent 0 74%,
            rgba(120, 120, 120, 0.4) 74% 75%,
            transparent 75% 100%
          );
        transform: translateY(2px);
      }

      .video-sketch.farm {
        left: 12px;
        top: -72px;
        width: 220px;
        height: 86px;
        background:
          linear-gradient(
            180deg,
            transparent 0 56%,
            rgba(102, 102, 102, 0.3) 56% 57%,
            transparent 57% 100%
          ),
          radial-gradient(
            circle at 35% 68%,
            rgba(96, 96, 96, 0.35) 0 1px,
            transparent 2px
          ),
          radial-gradient(
            circle at 63% 67%,
            rgba(96, 96, 96, 0.28) 0 1px,
            transparent 2px
          );
      }

      .video-sketch.farm::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 16px;
        bottom: 0;
        background:
          linear-gradient(
            0deg,
            transparent 0 46%,
            rgba(109, 109, 109, 0.4) 46% 48%,
            transparent 48% 100%
          ),
          linear-gradient(
            74deg,
            transparent 0 17%,
            rgba(109, 109, 109, 0.4) 17% 18%,
            transparent 18% 100%
          ),
          linear-gradient(
            102deg,
            transparent 0 65%,
            rgba(109, 109, 109, 0.4) 65% 66%,
            transparent 66% 100%
          );
      }

      .video-frame {
        position: relative;
        aspect-ratio: 545 / 340;
        overflow: hidden;
        box-shadow: 0 10px 20px rgba(59, 35, 11, 0.18);
      }

      .video-frame.black {
        background: #000;
      }

      .video-frame.gradient {
        background:
          linear-gradient(
            180deg,
            rgba(229, 232, 239, 0.96) 0%,
            rgba(238, 232, 222, 0.9) 20%,
            rgba(202, 216, 194, 0.18) 20.1%,
            rgba(144, 171, 108, 0.12) 100%
          ),
          linear-gradient(
            180deg,
            #ece7df 0%,
            #c6d2b0 45%,
            #8b9a63 46%,
            #7f6b55 100%
          );
      }

      .video-frame.photo {
        background: linear-gradient(
          180deg,
          #dfe7d5 0%,
          #b0bc8e 44%,
          #7d6b4a 100%
        );
      }

      .video-frame::before {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--video-overlay, none);
      }

      .video-photo {
        position: absolute;
        left: var(--video-photo-left, 32%);
        top: var(--video-photo-top, 12%);
        width: var(--video-photo-width, 55%);
        height: auto;
        filter: saturate(0.96) contrast(0.98);
      }

      .video-photo.full {
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .video-shadow {
        position: absolute;
        left: 29%;
        bottom: 18%;
        width: 30%;
        height: 10%;
        background: rgba(96, 72, 40, 0.22);
        border-radius: 50%;
        filter: blur(6px);
        animation: shadowMove 4.8s ease-in-out infinite;
      }

      .farm-still {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            180deg,
            transparent 0 25%,
            rgba(110, 127, 92, 0.12) 25% 50%,
            rgba(105, 73, 45, 0.16) 50% 100%
          ),
          linear-gradient(
            180deg,
            #ebeff4 0%,
            #d5ddca 32%,
            #93ab64 33%,
            #74814f 56%,
            #907659 100%
          );
      }

      .animal-floating {
        animation: float 4.8s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      @keyframes shadowMove {
        0%,
        100% {
          transform: translateX(0);
          opacity: 0.34;
        }
        35% {
          transform: translateX(-9px);
          opacity: 0.26;
        }
        70% {
          transform: translateX(7px);
          opacity: 0.3;
        }
      }

      @media (max-width: 980px) {
        .page {
          padding: 22px 18px 18px;
        }

        .content,
        .media-grid {
          grid-template-columns: 1fr;
        }

        .subtitle {
          left: 0;
          display: block;
          margin-left: 0.35rem;
        }

        .animal-stage {
          min-height: 360px;
        }

        .animal-image {
          width: min(100%, 430px);
        }

        .video-stage {
          width: 100%;
        }

        .video-sketch.grass,
        .video-sketch.farm {
          top: -60px;
        }
      }

      @media (max-width: 640px) {
        .page {
          padding: 18px 14px 16px;
        }

        h1 {
          font-size: clamp(4rem, 18vw, 5.8rem);
        }

        .intro,
        .facts,
        .curiosities {
          max-width: 100%;
          font-size: 1rem;
        }

        .heading,
        .video-title {
          font-size: 1.2rem;
        }

        .animal-stage {
          min-height: 320px;
        }

        .animal-stage::before {
          width: 250px;
          height: 250px;
        }
      }
    </style>
  </head>

          animalBottom: "-6px",
          videoKind: "gradient",
          videoSrc: "img/-61 1.png",
          videoPhotoLeft: "0",
          videoPhotoTop: "0",
          videoPhotoWidth: "100%",
          sketch: "farm",
        },
      };

      function factsMarkup(facts) {
        return facts
          .map(
            ([label, value]) =>
              `<p><span class="fact-label">${label}:</span> ${value}</p>`,
          )
          .join("");
      }

      function bulletsMarkup(items) {
        return `<ul class="curiosities">${items.map((item) => `<li>${item}</li>`).join("")}</ul>`;
      }

      function blockMarkup(page, side) {
        const heading = side === "left" ? page.leftHeading : page.rightHeading;
        const list =
          side === "left"
            ? page.leftBullets || page.leftItems || page.leftFacts || []
            : page.rightBullets ||
              page.rightItems ||
              page.rightFacts ||
              page.facts ||
              [];
        const isFacts = Array.isArray(list[0]);
        let html = "";
        if (heading) html += `<h2 class="heading">${heading}</h2>`;
        if (list.length) {
          html += isFacts
            ? `<div class="facts">${factsMarkup(list)}</div>`
            : bulletsMarkup(list);
        }
        return html;
      }

      function renderVideo(page) {
        const hasPhoto = page.videoKind !== "black";
        const classes =
          page.videoKind === "black"
            ? "video-frame black"
            : page.videoKind === "photo"
              ? "video-frame photo"
              : "video-frame gradient";
        const videoAsset = page.videoSrc
          ? `<img class="video-photo${page.videoKind === "photo" ? " full" : ""}" src="${page.videoSrc}" alt="${page.title.toLowerCase()} video preview" style="left:${page.videoPhotoLeft}; top:${page.videoPhotoTop}; width:${page.videoPhotoWidth};" />`
          : "";
        return `
          <div class="video-stage">
            <div class="video-sketch ${page.sketch || ""}" aria-hidden="true"></div>
            <h2 class="video-title">${page.videoTitle || "And in this video you will see it!!!"}</h2>
            <div class="${classes}">
              ${page.videoKind !== "black" ? '<div class="video-shadow" aria-hidden="true"></div>' : ""}
              ${videoAsset}
            </div>
          </div>
        `;
      }

      function render(page) {
        const leftPanel = `${blockMarkup(page, "left")}${page.mediaReverse ? renderAnimal(page) : renderVideo(page)}`;
        const rightPanel = `${blockMarkup(page, "right")}${page.mediaReverse ? renderVideo(page) : renderAnimal(page)}`;

        return `
          <section class="hero">
            <div class="title-block">
              <h1>${page.title}</h1>
              <span class="subtitle">${page.subtitle}</span>
            </div>
            ${page.intro ? `<p class="intro">${page.intro}</p>` : ""}
            <div class="content">
              <section class="panel">${leftPanel}</section>
              <section class="panel">${rightPanel}</section>
            </div>
          </section>
        `;
      }

      function renderAnimal(page) {
        return `
          <div class="animal-stage" style="--circle:${page.circle}; --circle-left:${page.circleLeft || "52px"}; --circle-bottom:${page.circleBottom || "24px"}; --circle-size:${page.circleSize || "300px"};">
            <img
              class="animal-image animal-floating${page.animalRight ? " fit-right" : ""}"
              src="${page.animalSrc}"
              alt="${page.title.toLowerCase()} illustration"
              style="--animal-left:${page.animalLeft || "-16px"}; --animal-right:${page.animalRight || "auto"}; --animal-bottom:${page.animalBottom || "0"}; --animal-width:${page.animalWidth || "500px"};"
            />
          </div>
        `;
      }

      const key = (location.hash || "#horse").replace("#", "").toLowerCase();
      const page = animalPages[key] || animalPages.horse;
      document.getElementById("app").innerHTML = render(page);
    </script>
  </body>
</html>
